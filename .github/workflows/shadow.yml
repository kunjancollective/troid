name: shadow — daily forward test

# Runs 20 minutes after every 4h bar closes (six times a day; 16:20 UTC is the
# reset run), pulls fresh 4h bars,
# replays troid-shadow-1 from its anchor, appends any newly closed trades to the
# journal, re-renders the ledger, and commits. Deterministic: same config + same
# bars = same result, so the only diff each day is what actually closed.
#
# Places nothing. Touches no account. The journal's logged_utc column is the proof
# that nothing here is backdated.

on:
  schedule:
    - cron: "20 0,4,8,12,16,20 * * *"   # 20 min after every 4h bar closes; 16:20 is the reset run
  workflow_dispatch:            # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backtest/requirements.txt

      - name: Install the tearsheet dependency
        run: pip install -q -r backtest/requirements.txt

      # Fetch from the first bar of the frozen history (engine.T0 = 2026-01-08 04:00 UTC),
      # then extend the FROZEN file with only the bars after its last bar. The frozen bars
      # are the sample the journal was built on. api.binance.com answers 451 on GitHub's
      # runners and api.binance.us differs from it on every bar, so replaying the whole
      # history on the live feed would journal a different past as if it were new.
      - name: Pull fresh bars and extend the frozen history
        working-directory: backtest
        run: |
          python fetch_binance.py BTCUSDT 2026-01-08T04:00:00 data/fresh_4h.csv
          head -1 data/fresh_4h.csv
          python stitch_bars.py data/btc_4h.csv data/fresh_4h.csv data/live_4h.csv
          head -1 data/live_4h.csv
          tail -1 data/live_4h.csv

      - name: Run the shadow and render the ledger
        working-directory: backtest
        env:
          TROID_RUN: shadow          # forward.py appends a runs.csv row only on shadow runs
        run: |
          python forward.py live_4h.csv
          python gen_ledger.py
          python gen_tearsheet.py
          python gen_compare.py
          python gen_results.py > RESULTS.md

      # verify_claims.py prints a RESULT line and always exits 0, so gate on the text.
      - name: Verify nothing drifted
        working-directory: backtest
        run: |
          python verify_claims.py > "$RUNNER_TEMP/verify.txt"
          grep 'RESULT:' "$RUNNER_TEMP/verify.txt"
          grep -q 'RESULT: 0 failed' "$RUNNER_TEMP/verify.txt"

      - name: Commit the day's diff
        run: |
          git config user.name "troid-shadow"
          git config user.email "shadow@troid.ai"
          # web/public as a whole: the English pages, and each published language's directory
          # (web/public/{lang}/, og/{lang}.png), added when a language goes live and removed when it is withdrawn
          git add backtest/journal.csv backtest/state.json backtest/runs.csv backtest/RESULTS.md \
                  web/context/firms.json backtest/data/live_4h.csv
          git add -A web/public
          if git diff --cached --quiet; then
            echo "no change today"
          else
            git commit -m "shadow: $(date -u +%Y-%m-%d) — $(python3 -c "import json;s=json.load(open('backtest/state.json'));print(f\"{s['trades_new_this_run']} new, balance {s['balance']:,.0f}, {s['outcome']}\")")"
            git push
          fi
