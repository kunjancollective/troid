name: data — expand history

# One-shot, manual. Pulls the multi-year 4h history the walk-forward needs
# (HANDOFF.md step 1) on a GitHub runner, because the sandbox that does the
# analysis has no Binance egress. api.binance.com refuses GitHub's runners (451);
# fetch_binance.py falls back to api.binance.us, which is the feed the ledger runs
# on. The files are committed so the walk-forward is reproducible from the repo.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow            # never race the daily shadow commit
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch BTCUSDT and ETHUSDT 4h from 2021-01-01
        working-directory: backtest
        run: |
          for s in BTCUSDT ETHUSDT; do
            python fetch_binance.py "$s" 2021-01-01 "data/${s}_4h.csv"
            head -1 "data/${s}_4h.csv"
            tail -1 "data/${s}_4h.csv"
          done

      - name: Commit the data
        run: |
          git config user.name "troid-shadow"
          git config user.email "shadow@troid.ai"
          git add -f backtest/data/BTCUSDT_4h.csv backtest/data/ETHUSDT_4h.csv
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: BTCUSDT and ETHUSDT 4h from 2021-01-01 (binance.us)"
            git push
          fi
