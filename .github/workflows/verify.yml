name: verify — every published claim re-derived

# backtest/verify_claims.py re-derives every figure troid publishes (the risk model, the ruin figures, the worked examples
# in TROID-CHARACTER.md, the canonical figures through claim_check.py) and prints "RESULT: N failed check(s)". It always
# exits 0, so this gates on that line, as shadow.yml does: anything but "RESULT: 0 failed", or no RESULT line at all,
# fails the check. Every pull request runs it, so a change that leaves a published figure or its check behind can't
# merge green (2026-10-08: #35 promoted TROID-CHARACTER.md's new wording, five checks still looked for the old, and the
# shadow loop, which commits only on "RESULT: 0 failed", stopped saving the ledger).
#
# It reads the repository only: no fetch, no key, no write. A branch rule on main requiring the status check "verify"
# is what makes a failure block the merge.

on:
  pull_request:
  workflow_dispatch:              # by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # site_build.py, which gen_compare.py imports, renders the page templates with jinja2; nothing else is needed
      - name: jinja2
        run: python -m pip install --quiet "jinja2>=3.1"

      - name: Every published claim re-derived
        working-directory: backtest
        shell: bash
        run: |
          python verify_claims.py 2>&1 | tee "$RUNNER_TEMP/verify.txt"
          if ! grep -qE '^ *RESULT: 0 failed check' "$RUNNER_TEMP/verify.txt"; then
            echo "::error title=verify_claims.py::$(grep -o 'RESULT:.*' "$RUNNER_TEMP/verify.txt" || echo 'no RESULT line')"
            grep -E '\] FAIL ' "$RUNNER_TEMP/verify.txt" || true
            exit 1
          fi
